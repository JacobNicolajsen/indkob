name: Deploy til cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key:      ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            cd ~/repositories/indkob
            git pull origin main
            npm install --production
            # Genstart: restart.txt virker ikke på denne host — dræb lsnode-processen,
            # den respawner automatisk ved næste request
            pkill -9 -f lsnode || true
